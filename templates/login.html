<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to SCOUT: Autonomous Cyber Threat Telemetry & Cybersecurity Defense Platform." />
  <meta name="application-name" content="SCOUT" />
  <meta name="apple-mobile-web-app-title" content="SCOUT" />
  <meta name="theme-color" content="#FAFAFA" />

  <!-- Favicon and Application Icons -->
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png" />

  <!-- Anti-Flash Synchronous Theme Initializer -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nss_theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var activeTheme = savedTheme ? savedTheme : (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', activeTheme);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', activeTheme === 'dark' ? '#09090B' : '#FAFAFA');
      } catch (e) {}
    })();
  </script>
  <title>SCOUT — Sign In | Threat Defense & Telemetry</title>

  <!-- Google Fonts: Plus Jakarta Sans (Headings), Inter (Body), JetBrains Mono (Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- SCOUT Design System -->
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-page login-page">
  <!-- Top Navigation Bar -->
  <header class="auth-top-nav" role="banner">
    <!-- Top-left: Theme Toggle -->
    <div class="auth-nav-left">
      <button class="theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Toggle Dark and Light Mode" title="Toggle Theme">
        <i class="fas fa-moon" id="themeToggleIcon"></i>
        <span class="theme-toggle-text" id="themeToggleText">Dark Mode</span>
      </button>
    </div>

    <!-- Center: SCOUT Brand Logo -->
    <div class="auth-nav-brand">
      <a href="/?public=1" class="auth-brand-link" aria-label="SCOUT Home" title="SCOUT Platform">
        <img src="/static/images/scout-logo.png" alt="SCOUT" class="scout-brand-logo scout-logo-light" />
        <img src="/static/images/scout-logo-dark.png" alt="SCOUT" class="scout-brand-logo scout-logo-dark" />
      </a>
    </div>

    <!-- Top-right: Home Page Button -->
    <div class="auth-nav-right">
      <a href="/?public=1" class="auth-nav-home-btn" id="homePageBtn" title="Return to public SCOUT Homepage">
        <i class="fas fa-house"></i>
        <span>Home Page</span>
      </a>
    </div>
  </header>

  <!-- Main Authentication Form Content -->
  <main class="auth-main-wrapper" role="main">
    <div class="auth-card-container">
      <div class="auth-card">
        <!-- Auth Card Header -->
        <div class="auth-card-header">
          <div class="auth-badge-icon">
            <i class="fas fa-shield-halved"></i>
          </div>
          <h1 class="auth-title">Sign In to SCOUT</h1>
          <p class="auth-subtitle">Autonomous Real-Time Threat Telemetry &amp; Cybersecurity Defense</p>
        </div>

        <!-- Session Notice Banner (Visible if user already has an active session) -->
        <div class="auth-session-banner" id="authSessionBanner" style="display: none;">
          <div class="auth-session-info">
            <i class="fas fa-circle-check auth-session-icon"></i>
            <span id="authSessionText">You are currently signed in.</span>
          </div>
          <a href="/?view=dashboard" class="auth-session-link" id="authSessionLink">Go to Workspace &rarr;</a>
        </div>

        <!-- Alert Banner (Feedback for errors and success) -->
        <div class="auth-alert" id="authAlert" role="alert" style="display: none;">
          <i class="auth-alert-icon fas fa-circle-exclamation" id="authAlertIcon"></i>
          <span class="auth-alert-message" id="authAlertMessage"></span>
        </div>

        <!-- Standalone Sign In Form -->
        <form class="auth-form" id="loginForm" novalidate autocomplete="on">
          <div class="auth-form-group">
            <label for="loginIdentifier" class="auth-label">Email Address or Phone Number</label>
            <div class="auth-input-wrap">
              <i class="fas fa-id-badge auth-input-icon" aria-hidden="true"></i>
              <input
                type="text"
                id="loginIdentifier"
                name="identifier"
                class="auth-input"
                placeholder="e.g. analyst@domain.com or +1 (555) 123-4567"
                autocomplete="username"
                required
                spellcheck="false"
                autofocus
              />
            </div>
            <span class="auth-field-error" id="loginIdentifierError"></span>
          </div>


          <div class="auth-form-group">
            <div class="auth-label-row">
              <label for="loginPassword" class="auth-label">Password</label>
            </div>
            <div class="auth-input-wrap">
              <i class="fas fa-lock auth-input-icon" aria-hidden="true"></i>
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="auth-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="auth-toggle-pwd" id="togglePasswordBtn" title="Show/Hide Password" aria-label="Toggle password visibility">
                <i class="fas fa-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
            <span class="auth-field-error" id="loginPasswordError"></span>
          </div>

          <button type="submit" class="btn-auth-primary" id="loginSubmitBtn">
            <span class="auth-btn-spinner" id="loginSpinner" style="display: none;"><i class="fas fa-circle-notch fa-spin"></i></span>
            <span class="auth-btn-text" id="loginBtnText">Sign In</span>
            <i class="fas fa-arrow-right auth-btn-icon" id="loginBtnIcon"></i>
          </button>
        </form>

        <!-- Card Footer Prompt -->
        <div class="auth-card-footer">
          <p class="auth-switch-text">
            Don't have an account?
            <a href="/register" class="auth-switch-link" id="linkToRegister">Create an account</a>
          </p>
        </div>
      </div>

      <!-- Security Meta Footer -->
      <footer class="auth-page-meta">
        <p><i class="fas fa-lock"></i> End-to-end encrypted session &bull; Zero telemetry compromise</p>
      </footer>
    </div>
  </main>

  <!-- Dedicated Authentication Logic Script -->
  <script src="/static/auth.js"></script>
</body>
</html>
